# CARVER layer contract — who may import what.

# The pure domain core infers nothing from the BOND suite; the mission adapter
# is the only module that imports bond_api; figures/manuscript_variables are
# workflow modules that render or inject.

surfaces:
  pure_domain:
    description: >-
      The six concept models (media manipulation, narrative control, stealth
      detection, radar waveform, GPS denial, GNSS integrity) plus the
      canonical scenario that runs them.
    modules:
      - src/tomorrow_never_dies/media_manipulation.py
      - src/tomorrow_never_dies/narrative_control.py
      - src/tomorrow_never_dies/stealth_detection.py
      - src/tomorrow_never_dies/radar_waveform.py
      - src/tomorrow_never_dies/gps_denial.py
      - src/tomorrow_never_dies/gnss_integrity.py
      - src/tomorrow_never_dies/scenario.py
    rule: "stdlib + numpy + sibling core modules only; must NOT import bond_api, infrastructure.*, or matplotlib."

  protocol_adapter:
    description: "The single bridge between the domain core and bond_api."
    modules:
      - src/tomorrow_never_dies/mission.py
    rule: "May import bond_api; must NOT contain domain math beyond wiring."

  workflow:
    description: "Rendering and manuscript-injection workflows."
    modules:
      - src/tomorrow_never_dies/figures.py
      - src/tomorrow_never_dies/manuscript_variables.py
    rule: "May import matplotlib / yaml; must defer all computation to the core."

  orchestrators:
    description: "Thin CLIs; no business logic."
    modules:
      - scripts/brief.py
      - scripts/recon.py
      - scripts/plan.py
      - scripts/execute.py
      - scripts/debrief.py
      - scripts/run_mission.py
      - scripts/z_generate_manuscript_variables.py
    rule: "Import src modules and forward; never implement math in-place."

enforced_by:
  description: >-
    tests/test_package_surface.py — reads the pure_domain module list from
    THIS file (all seven entries, scenario.py included), greps each of those
    files for banned imports, and separately asserts the list equals CONCEPTS
    (src/tomorrow_never_dies/__init__.py) plus scenario. A module added
    without being declared here fails the suite, and a banned import added to
    scenario.py fails it too.
  rule: "No infrastructure.*, bond_api, or matplotlib imports inside the pure_domain surface."
