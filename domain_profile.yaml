domain: mission_software
display_name: CARVER — Special-Agent Mission Software
required_packages:
  - numpy
  - matplotlib
  - pyyaml
  - bond-api
preferred_outputs:
  - pdf
  - html
  - json
validation_gates:
  - experiment_method_design
  - artifact_manifest
  - evidence_grounding
  - render_validation
figure_types:
  - disinformation_propagation
  - stealth_detection
  - gps_denial
citation_policy: official_or_scholarly
source_policy: "Prefer primary project outputs, official package documentation, and scholarly radar / navigation / opinion-dynamics references."
review_gates:
  - experiment_method_design
  - render_validation
artifact_expectations:
  - output/data/manuscript_variables.json
  - output/figures/disinformation_propagation.png
  - output/figures/stealth_detection.png
  - output/figures/gps_denial.png
  - output/manuscript/03_results.md
benchmark_rubric:
  name: carver-mission-readiness
  dimensions:
    - name: output_validity
      weight: 1.0
    - name: reproducibility_bundle
      weight: 1.0
    - name: artifact_manifest
      weight: 1.0
    - name: evidence_grounding
      weight: 2.0
    - name: protocol_conformance
      weight: 1.0
llm_prompt_guidance: "Use generated scenario artifacts and the manuscript variable map as the evidence source; do not invent numeric results. All metrics come from the seeded CARVER scenario." 
